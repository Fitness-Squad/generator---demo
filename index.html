<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ניהול תקלות גנרטורים</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--surface:#111e30;--surface2:#18283d;--line:#2a3b52;--text:#f0f6ff;--muted:#9db0c7;--accent:#53d9e7;--green:#24c997;--red:#ff657e;--amber:#ffc36d}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 90% 0%,#163c50 0%,transparent 38%),linear-gradient(180deg,#091727,#07111f 45%,#0b1524);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text);line-height:1.55}
header{position:relative;overflow:hidden;background:linear-gradient(125deg,#102c41 0%,#11263a 55%,#102034 100%);color:var(--text);padding:35px 22px 30px;text-align:right;border-bottom:1px solid #29455c}
header:before{content:"";position:absolute;width:210px;height:210px;left:-75px;top:-110px;background:radial-gradient(circle,#37b9cc55,transparent 70%);pointer-events:none}
header:after{content:"●  DEMO  •  V9";display:inline-block;margin-top:16px;padding:5px 12px;border:1px solid #477389;background:#15394a;border-radius:100px;color:#a9e8ef;font-size:11px;font-weight:800;letter-spacing:1.4px}
header h1{margin:0;font-size:clamp(25px,6vw,34px);font-weight:850;letter-spacing:-.8px}
header h1:first-letter{color:var(--accent)}
header p{color:#b6cadb;margin:8px 0 0;font-size:14px}
main{max-width:740px;margin:auto;padding:16px 16px 70px}
.card{background:linear-gradient(160deg,#15243a 0%,#101c2d 100%);border:1px solid #2b3e56;border-radius:23px;padding:23px;margin:14px 0;box-shadow:0 12px 38px #02091455}
.card:first-child{border-top:2px solid #45cbd5}
h2{margin:0 0 17px;font-size:22px;font-weight:800;letter-spacing:-.3px}
h3{margin:20px 0 12px;font-size:17px;color:#dcebf8}
p{margin:11px 0}
label{display:block;margin-top:13px;color:#d3e3f0;font-size:14px;font-weight:700}
button{display:block;width:100%;border:1px solid #3c6c87;border-radius:14px;padding:15px 17px;margin:10px 0;font-size:15px;font-weight:750;background:linear-gradient(135deg,#176b8c,#165577);color:#f6fbff;cursor:pointer;transition:transform .15s ease,filter .15s ease,box-shadow .15s ease;box-shadow:0 3px 12px #00000022;text-align:center;min-height:49px}
button:active{transform:scale(.98);filter:brightness(1.15)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.green{background:linear-gradient(135deg,#0d967b,#127d71);border-color:#22a98b}
button.red{background:linear-gradient(135deg,#b74765,#943e5d);border-color:#db7289}
button.gray{background:#1d3047;border-color:#344b64;color:#dbe8f6;box-shadow:none}
button.gold{background:linear-gradient(135deg,#c58d39,#a8762b);border-color:#e1ae61;color:#111d2b}
input,textarea,select{width:100%;padding:13px 14px;border:1px solid #3a526c;border-radius:13px;font-size:16px;margin:7px 0 10px;background:#0b192a;color:var(--text);font-family:inherit}
input::placeholder,textarea::placeholder{color:#8297ad}
option{background:#102037;color:white}
.small{color:var(--muted);font-size:13px;line-height:1.6}
.badge{background:#1a2d42;border:1px solid #30485f;border-radius:15px;padding:15px;margin:12px 0;color:#e2edf8;overflow-wrap:anywhere}
.badge strong{color:#77e1ea}
.note{background:#312a20;border:1px solid #695439;border-right:4px solid var(--amber);padding:14px;border-radius:12px;color:#ffe5b7}
.progress{height:8px;background:#2a3b50;border-radius:9px;margin:18px 0;overflow:hidden}
.progress div{height:100%;background:var(--green);border-radius:9px}
.row{display:flex;gap:10px}.row button{flex:1}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}
.metric{background:linear-gradient(145deg,#20374d,#192a40);border:1px solid #38536c;border-radius:17px;padding:17px 9px;text-align:center;color:#c7d7e7;font-size:12px}
.metric strong{display:block;font-size:clamp(20px,5vw,29px);color:#74e4df;margin-top:7px;line-height:1.35;overflow-wrap:anywhere}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{flex:1;min-width:0;padding:10px 4px;font-size:13px;margin:0;border-radius:11px}
.chart{height:195px;display:flex;align-items:end;gap:3px;border-bottom:1px solid #527089;background:repeating-linear-gradient(to top,transparent 0,transparent calc(25% - 1px),#263d52 calc(25% - 1px),#263d52 25%);border-radius:10px 10px 0 0;padding:8px 4px 0;overflow:hidden}
.bar{flex:1;min-width:2px;background:var(--green);border-radius:5px 5px 0 0;box-shadow:0 0 7px #24c99722}
@media(min-width:650px){header{padding-right:max(28px,calc((100vw - 700px)/2))}main{padding-top:22px}.card{padding:28px}}
@media(max-width:370px){.card{padding:16px}.tabs button{font-size:12px}.metric{padding:12px 5px}}

.home-hero{background:linear-gradient(145deg,#19354b,#102137);border:1px solid #34627a;border-radius:24px;padding:23px;margin:14px 0;box-shadow:0 12px 40px #0005}
.home-hero h2{font-size:23px;margin-bottom:4px}.home-hero .small{margin-bottom:16px}
.gauge-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.gauge-tile{background:#102337;border:1px solid #2d5066;border-radius:18px;padding:13px 6px;text-align:center;min-width:0}
.gauge{--v:100;--ring:#24c997;width:min(100%,120px);aspect-ratio:1;margin:0 auto 10px;border-radius:50%;background:conic-gradient(var(--ring) calc(var(--v)*1%),#2d4053 0);display:grid;place-items:center;position:relative}
.gauge:before{content:"";position:absolute;inset:10%;border-radius:50%;background:#102337}
.gauge strong{position:relative;font-size:clamp(18px,4vw,28px);color:#e8f9ff;z-index:1;letter-spacing:-1px}
.gauge-tile span{font-size:12px;color:#c3d7e6;display:block;line-height:1.35}
.home-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:13px}
.home-strip div{background:#1c3448;border-radius:13px;padding:11px 5px;text-align:center;font-size:11px;color:#c5d8e8}
.home-strip strong{display:block;font-size:23px;color:#f1fbff}
.fleet-map{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:9px}
.fleet-node{background:#162c40;border:1px solid #3b586d;border-radius:15px;padding:13px 9px;text-align:right;color:#e9f5ff;font-size:13px}
.fleet-node:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#24c997;margin-left:7px;box-shadow:0 0 8px #24c99788}
.fleet-node.off:before{background:#ff657e;box-shadow:0 0 8px #ff657e88}
.fleet-node small{display:block;color:#9fb7c9;margin-top:5px}
@media(max-width:370px){.gauge-grid{gap:5px}.gauge-tile{padding:10px 3px}.gauge:before{inset:11%}.gauge strong{font-size:17px}}

.ticket-sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:15px 0}
.ticket-section{background:#1d3047;border:1px solid #3a536b;border-radius:14px;padding:13px;text-align:center;font-size:13px}
.ticket-section strong{display:block;font-size:26px;color:#eaf8ff}
.ticket-section.open{border-color:#d8a356}.ticket-section.done{border-color:#28ae8b}
.ticket-card{border-right:4px solid #dca85b}
.ticket-card.done{border-right-color:#2ec89d;opacity:.9}
.trade-tag{display:inline-block;padding:6px 10px;border-radius:9px;font-size:12px;font-weight:800;margin:6px 0}
.trade-electric{background:#42351e;color:#ffe092;border:1px solid #98753a}
.trade-water{background:#163b54;color:#8edcff;border:1px solid #387ca2}
.trade-mechanic{background:#432b40;color:#ffc0ed;border:1px solid #895478}
.trade-general{background:#2a3b46;color:#d5e4f0;border:1px solid #506679}
.ticket-state{display:inline-block;border-radius:8px;padding:4px 9px;font-size:12px;background:#2a4055;color:#d9edfa;margin:4px}

.plan-filters{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.plan-filters label{font-size:12px}
.plan-card{border:1px solid #36516a;border-right:4px solid #ffc36d;background:#172b40;border-radius:15px;padding:15px;margin:12px 0}
.plan-card.critical{border-right-color:#ff657e}
.plan-card h3{margin:0 0 7px}
.plan-card .small{margin:5px 0}
.priority{display:inline-block;border-radius:8px;padding:4px 9px;background:#36455b;color:#e4f2ff;font-size:12px;font-weight:700}
.priority.high{background:#5d2838;color:#ffc5d0}
.priority.medium{background:#4b3b24;color:#ffdfac}
.plan-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.plan-stats div{text-align:center;background:#1b3348;padding:10px 4px;border-radius:12px;font-size:11px}
.plan-stats strong{display:block;font-size:23px;color:#85e2e7}

.timeline-entry{border-right:3px solid #43c7d6;padding:10px 14px;margin:12px 0;background:#162b3f;border-radius:11px}
.timeline-entry time{display:block;font-size:12px;color:#9cc8d6;margin-bottom:5px}
.timeline-entry strong{color:#7ce3e6}
.duplicate-warning{background:#42301f;border:1px solid #a77938;border-radius:13px;padding:13px;color:#ffe0a9;margin:12px 0}

.role-select{background:#1b3448;border:1px solid #4c6a7c;border-radius:13px;padding:11px;width:100%;color:#f3fcff}
.notice-item{background:#1a3045;border-right:4px solid #4bd4e0;border-radius:13px;padding:14px;margin:11px 0}
.notice-item.pending{border-right-color:#ffc36d}
.notice-count{background:#e65d78;color:white;border-radius:99px;padding:2px 8px;font-weight:800}
</style>
</head>
<body>
<header>
<h1>⚡ מרכז ניהול גנרטורים</h1>
<p>אבחון תקלות • כשירות • אחזקה חודשית</p>
</header>
<main id="app"></main>
<script>
const $=document.getElementById("app");
const KEY="generator_demo_v8";
const GENERATORS=["GEN-DEMO-001","GEN-DEMO-002","GEN-DEMO-003","GEN-DEMO-004","GEN-DEMO-005"];
let period="day",filterGen="all";
const MKEY="generator_demo_maintenance_v9";
let maintenance={};try{maintenance=JSON.parse(localStorage.getItem(MKEY))||{}}catch(e){}
function saveMaintenance(){localStorage.setItem(MKEY,JSON.stringify(maintenance))}
function monthKey(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function previousMonth(d=new Date()){return monthKey(new Date(d.getFullYear(),d.getMonth()-1,1))}
function maintRecords(g){return maintenance[g]||[]}
function currentMaint(g){return maintRecords(g).some(x=>x.month===monthKey())}
function dueMaintenance(){return GENERATORS.filter(g=>!currentMaint(g))}
function recurring(g){let since=Date.now()-90*86400000;return tickets.filter(t=>t.generator===g&&t.createdAt>=since).length}
function health(g){let n=recurring(g),[a,b]=bounds("month");return Math.max(0,Math.round(pct(a,b,g)-Math.min(35,n*5)-(currentMaint(g)?0:10)))}
function maintenanceHome(){let due=dueMaintenance();show(`<div class="card"><h2>🛠️ שגרת אחזקה חודשית</h2><p class="note">כל גנרטור נדרש לטיפול אחת לחודש. רשימת הבדיקות היא דוגמה בלבד ואינה הוראת טיפול. יש לפעול לפי הוראות יצרן וגורם מוסמך.</p><div class="badge">חודש: ${monthKey()} | בוצעו: ${GENERATORS.length-due.length}/${GENERATORS.length} | ממתינים: ${due.length}</div>${GENERATORS.map(g=>`<div class="badge"><strong>${g}</strong><br>${currentMaint(g)?"✅ הטיפול החודשי תועד":"🟠 ממתין לטיפול חודשי"}<br>ציון בריאות משוער: ${health(g)}/100<br>קריאות ב־90 יום: ${recurring(g)}${btn("כרטיס גנרטור / טיפול",`generatorCard('${g}')`,"gray")}</div>`).join("")}${btn("🏠 חזרה","home()","gray")}</div>`)}
function generatorCard(g){generator=g;let records=maintRecords(g),related=tickets.filter(t=>t.generator===g),last=records.at(-1);show(`<div class="card"><h2>⚙️ ${g}</h2><div class="grid"><div class="metric">כשירות<strong>${ready(g)?"🟢":"🔴"}</strong></div><div class="metric">בריאות משוערת<strong>${health(g)}/100</strong></div></div><p>תקלות ב־90 יום: ${recurring(g)} ${recurring(g)>=3?"⚠️ תקלות חוזרות":""}</p><p>טיפול חודשי: ${currentMaint(g)?"בוצע":"ממתין לביצוע"}</p><p>טיפול אחרון: ${last?new Date(last.at).toLocaleDateString("he-IL"):"אין תיעוד"}</p><h3>היסטוריית טיפולים</h3>${records.length?records.slice().reverse().map(x=>`<div class="badge">${esc(x.month)} — ${new Date(x.at).toLocaleString("he-IL")}<br>מבצע: ${esc(x.by)}<br>הערות: ${esc(x.notes||"ללא")}</div>`).join(""):"<p>אין עדיין טיפולים מתועדים.</p>"}${btn("🛠️ תיעוד טיפול חודשי","maintenanceForm()","green")}${btn("🚨 פתיחת תקלה","directReport()","red")}${btn("חזרה לשגרות","maintenanceHome()","gray")}</div>`)}
function maintenanceForm(){show(`<div class="card"><h2>🛠️ תיעוד טיפול חודשי</h2><p>גנרטור: ${generator} | חודש: ${monthKey()}</p><p class="note">הטופס הוא תיעוד מנהלתי בלבד. אין לבצע טיפול על סמך רשימה זו. טיפול בפועל ייעשה לפי נוהל מאושר בידי איש מקצוע מוסמך.</p><label>שם מבצע (דמה בלבד)</label><input id="maintBy" maxlength="70" placeholder="טכנאי דמה"><label>תוצאת טיפול</label><select id="maintResult"><option value="done">בוצע והושלם</option><option value="issue">נמצאה תקלה — נדרשת קריאה</option></select><label>הערות (דמה בלבד)</label><textarea id="maintNotes" maxlength="300" placeholder="הערות לדוגמה"></textarea>${btn("שמור תיעוד טיפול","completeMaintenance()","green")}${btn("חזרה","generatorCard(generator)","gray")}</div>`)}
function completeMaintenance(){let by=document.getElementById("maintBy").value.trim()||"טכנאי דמה",notes=document.getElementById("maintNotes").value.trim(),issue=document.getElementById("maintResult").value==="issue";if(!maintenance[generator])maintenance[generator]=[];if(maintenance[generator].some(x=>x.month===monthKey())){alert("טיפול לחודש זה כבר תועד");return}maintenance[generator].push({month:monthKey(),at:Date.now(),by,notes,issue});saveMaintenance();if(issue){alert("התיעוד נשמר. כעת יש לפתוח קריאת תקלה.");directReport()}else generatorCard(generator)}

let tickets=[];
try{tickets=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
let step="",history=[],generator="GEN-DEMO-001",result="";
if(!localStorage.getItem(KEY)){try{tickets=(JSON.parse(localStorage.getItem("generator_demo_v7"))||[]).map(t=>({...t,impactsReadiness:false,createdAt:null,closedAt:null}));save()}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tickets))}catch(e){}}
function show(html){$.innerHTML=html}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&#39;","'":"&#39;"}[c]))}
function closed(t){return ["סגורה","נסגרה עצמאית"].includes(t.status)}
function ready(g){return !tickets.some(t=>t.generator===g&&t.impactsReadiness&&!closed(t))}
function dur(ms){let m=Math.max(0,Math.floor(ms/60000));return (Math.floor(m/1440)?Math.floor(m/1440)+" ימים ":"")+(Math.floor(m%1440/60)?Math.floor(m%1440/60)+" שעות ":"")+(m%60)+" דקות"}
function span(t){return t.createdAt?dur((t.closedAt||Date.now())-t.createdAt):"לא זמין (קריאה ישנה)"}
function unreadySpan(t){return t.impactsReadiness?span(t):"הקריאה אינה מוגדרת כמשביתה"}
function outage(g,a,b){let intervals=tickets.filter(t=>t.generator===g&&t.impactsReadiness&&t.createdAt).map(t=>[Math.max(a,t.createdAt),Math.min(b,t.closedAt||Date.now())]).filter(x=>x[1]>x[0]).sort((x,y)=>x[0]-y[0]);let total=0,last=null;for(const [x,y] of intervals){if(!last)last=[x,y];else if(x<=last[1])last[1]=Math.max(last[1],y);else{total+=last[1]-last[0];last=[x,y]}}if(last)total+=last[1]-last[0];return total}
function pct(a,b,g){if(b<=a)return 100;let gs=g==="all"?GENERATORS:[g];return Math.max(0,100*(1-gs.reduce((n,x)=>n+outage(x,a,b),0)/((b-a)*gs.length)))}
function bounds(p){let d=new Date(),b=Date.now();d.setHours(0,0,0,0);if(p==="week")d.setDate(d.getDate()-6);if(p==="month")d.setDate(d.getDate()-29);if(p==="year"){d.setDate(1);d.setMonth(d.getMonth()-11)}return [d.getTime(),b]}
function chartData(p,g){let now=new Date(),data=[];if(p==="day"){let start=new Date();start.setHours(0,0,0,0);for(let i=0;i<=now.getHours();i++){let a=start.getTime()+i*3600000;data.push([String(i),pct(a,Math.min(a+3600000,Date.now()),g)])}}else if(p==="week"||p==="month"){let n=p==="week"?7:30;for(let i=n-1;i>=0;i--){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);let a=d.getTime();data.push([d.getDate()+"/"+(d.getMonth()+1),pct(a,Math.min(a+86400000,Date.now()),g)])}}else{for(let i=11;i>=0;i--){let d=new Date(now.getFullYear(),now.getMonth()-i,1),a=d.getTime(),b=Math.min(Date.now(),new Date(d.getFullYear(),d.getMonth()+1,1).getTime());data.push([(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(-2),pct(a,b,g)])}}return data}

function btn(label,action,cls=""){
return `<button class="${cls}" onclick="${esc(action)}">${label}</button>`
}

function seedDemo(){
if(tickets.some(t=>t.demoSeed)){alert("נתוני ההדגמה כבר נטענו. אפשר להסיר אותם ואז לטעון מחדש.");return}
let now=Date.now(),hour=3600000,day=24*hour;
let specs=[
[0,1,2,3,"תקלה במערכת התנעה (דמה)",true],
[1,2,5,7,"תקלה במערכת אספקת חשמל (דמה)",true],
[2,3,9,4,"בדיקת התראה בלוח פיקוד (דמה)",false],
[0,4,14,8,"כשל התנעה חוזר (דמה)",true],
[3,5,20,14,"תקלה בחיווי חיישן (דמה)",false],
[1,6,25,10,"הפסקת פעולה לא צפויה (דמה)",true],
[0,7,35,5,"כשל התנעה חוזר (דמה)",true],
[4,8,45,18,"השבתה לבדיקת מערכת (דמה)",true],
[2,9,55,3,"תקלה לא משביתה (דמה)",false],
[0,10,65,9,"כשל התנעה חוזר (דמה)",true],
[3,11,75,11,"השבתה זמנית (דמה)",true],
[1,12,85,6,"תקלה במערכת התנעה (דמה)",true]
];
specs.forEach(([gi,ix,days,hours,description,impactsReadiness])=>{
let createdAt=now-days*day-(ix%4)*hour,closedAt=createdAt+hours*hour;
tickets.push({trade:["electric","water","mechanic","general"][ix%4],id:"DEMO-HIST-"+String(ix).padStart(3,"0"),generator:GENERATORS[gi],status:"סגורה",description,result:"resolved",history:[],date:new Date(createdAt).toLocaleString("he-IL"),createdAt,closedAt,impactsReadiness,demoSeed:true})
});
tickets.filter(t=>t.demoSeed).forEach((t,i)=>{t.trade=["electric","water","mechanic","electric","general"][i%5]});
let openStart=now-7*hour;
tickets.unshift({id:"DEMO-OPEN-001",generator:GENERATORS[2],status:"בטיפול",description:"תקלה משביתה פעילה להמחשה",result:"unresolved",history:[],date:new Date(openStart).toLocaleString("he-IL"),createdAt:openStart,closedAt:null,impactsReadiness:true,trade:"electric",demoSeed:true});
tickets.unshift({id:"DEMO-OPEN-002",generator:GENERATORS[0],status:"חדשה",description:"התראה לא משביתה להמחשה",result:"unresolved",history:[],date:new Date(now-2*hour).toLocaleString("he-IL"),createdAt:now-2*hour,closedAt:null,impactsReadiness:false,trade:"water",demoSeed:true});
let d=new Date();
for(let monthsAgo=0;monthsAgo<4;monthsAgo++){
let target=new Date(d.getFullYear(),d.getMonth()-monthsAgo,1);
let key=monthKey(target),limit=monthsAgo===0?3:5;
for(let i=0;i<limit;i++){
let g=GENERATORS[i];if(!maintenance[g])maintenance[g]=[];

function checkDuplicate(){let g=document.getElementById("reportGen").value,i=activeTicket(g),el=document.getElementById("duplicateNotice"),send=document.getElementById("createNewBtn");if(!el)return;if(i>=0){el.innerHTML=`<div class="duplicate-warning">⚠️ לגנרטור ${esc(g)} כבר קיימת קריאה פתוחה (${esc(tickets[i].id)}). לא תיפתח קריאה נוספת.<br>${btn("המשך טיפול בקריאה הקיימת",`ticket(${i})`,"gold")}</div>`;if(send)send.style.display="none"}else{el.innerHTML="";if(send)send.style.display="block"}}
function appendUpdate(i){if(currentPerson().role==="reporter")return myTickets();let t=tickets[i];if(!t||closed(t))return;let actor=document.getElementById("updateActor").value.trim()||"איש מקצוע דמה",note=document.getElementById("updateNote").value.trim(),trade=document.getElementById("updateTrade").value;if(!note){alert("יש לכתוב מה נבדק או בוצע");return}let old=t.trade||"general";logEvent(t,actor,note,"diagnosis");if(trade!==old){logEvent(t,actor,"העברת טיפול: "+TRADES[old][0]+" ← "+TRADES[trade][0],"handoff");t.trade=trade;routeFault(t,actor)}else if(t.status==="חדשה")t.status="בטיפול";t.lastActor=actor;save();ticket(i)}
function updateForm(i){if(currentPerson().role==="reporter")return myTickets();let t=tickets[i];if(!t||closed(t))return ticket(i);show(`<div class="card"><h2>📝 המשך סיפור תקלה</h2><p>${esc(t.generator)} · ${esc(t.id)}</p><p class="note">כל עדכון יתווסף לסיפור הדרך עם תאריך ושעה. מידע קודם לא יימחק, ומדידת משך התקלה תמשיך מתאריך הפתיחה המקורי.</p><label>מי ביצע את האבחון / העדכון?</label><input id="updateActor" maxlength="70" placeholder="לדוגמה: מכונאי א׳ (דמה בלבד)"><label>מה נבדק, מה נמצא ומה בוצע?</label><textarea id="updateNote" rows="5" maxlength="1200" placeholder="תיאור המשך הטיפול"></textarea><label>העברה לגורם מקצועי אחר (אם נדרש)</label><select id="updateTrade">${Object.entries(TRADES).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join("")}</select>${btn("💾 הוסף עדכון לסיפור הדרך",`appendUpdate(${i})`,"green")}${btn("חזרה לקריאה",`ticket(${i})`,"gray")}</div>`);document.getElementById("updateTrade").value=t.trade||"general"}
const DEMO_PEOPLE=[
{id:"reporter",label:"👤 מדווח שטח א׳",role:"reporter"},
{id:"reporter-b",label:"👤 מדווח שטח ב׳",role:"reporter"},
{id:"manager-electric",label:"👨‍💼 מנהל חשמלאים",role:"manager",trade:"electric"},
{id:"manager-mechanic",label:"👨‍💼 מנהל מכונאים",role:"manager",trade:"mechanic"},
{id:"manager-water",label:"👨‍💼 מנהל מים",role:"manager",trade:"water"},
{id:"manager-general",label:"👨‍💼 מנהל אבחון",role:"manager",trade:"general"},
{id:"tech-electric-1",label:"⚡ חשמלאי א׳",role:"tech",trade:"electric"},
{id:"tech-electric-2",label:"⚡ חשמלאי ב׳",role:"tech",trade:"electric"},
{id:"tech-mechanic-1",label:"🔧 מכונאי א׳",role:"tech",trade:"mechanic"},
{id:"tech-mechanic-2",label:"🔧 מכונאי ב׳",role:"tech",trade:"mechanic"},
{id:"tech-water-1",label:"💧 איש מים א׳",role:"tech",trade:"water"},
{id:"tech-general-1",label:"🧰 מאבחן א׳",role:"tech",trade:"general"},
{id:"maintenance-chief",label:"🛠️ מנהל אחזקה",role:"chief"}
];
let demoUser=localStorage.getItem("generator_demo_role")||"reporter";
function currentPerson(){return DEMO_PEOPLE.find(x=>x.id===demoUser)||DEMO_PEOPLE[0]}
function personName(id){return (DEMO_PEOPLE.find(x=>x.id===id)||{}).label||"טרם שובץ"}
function routeManager(t){return DEMO_PEOPLE.find(x=>x.role==="manager"&&x.trade===(t.trade||"general"))}
function setDemoUser(){demoUser=document.getElementById("demoRole").value;localStorage.setItem("generator_demo_role",demoUser);home()}
function routeFault(t,actor="מערכת"){t.assignedId=null;t.acceptedAt=null;t.managerId=routeManager(t)?.id||"manager-general";t.status="בתכנון";logEvent(t,actor,"הקריאה הועברה לתור "+personName(t.managerId),"route")}
function inboxEntries(){let p=currentPerson();return tickets.map((t,i)=>({t,i})).filter(({t})=>!closed(t)&&(p.role==="chief"||(p.role==="manager"&&t.managerId===p.id)||(p.role==="tech"&&t.assignedId===p.id)))}
function inbox(){
if(currentPerson().role==="reporter")return reporterHome();let p=currentPerson(),entries=inboxEntries();show(`<div class="card"><h2>🔔 תיבת משימות — ${esc(p.label)}</h2><p class="small">התראות פנימיות לדוגמה; מעבר בין משתמשי הדמה מדמה מכשירים שונים, אך אינו שולח התראות אמיתיות.</p>
${entries.length?entries.map(({t,i})=>`<div class="notice-item ${!t.assignedId?"pending":""}"><strong>${esc(t.generator)}</strong> · ${esc(t.id)}<br>${tradeTag(t)}<p>${esc(t.description)}</p><p class="small">${!t.assignedId?"🟠 ממתין לשיבוץ":t.acceptedAt?"🟢 התקבלה המשימה":"🟡 ממתין לאישור קבלה"} · ${esc(t.status)}</p>
${p.role==="manager"&&!t.assignedId?btn("👨‍🔧 שיבוץ איש מקצוע",`assignScreen(${i})`,"gold"):""}
${p.role==="tech"&&!t.acceptedAt?btn("✅ קיבלתי את המשימה",`acceptTask(${i})`,"green"):""}
${btn("📖 סיפור דרך",`ticket(${i})`,"gray")}</div>`).join(""):"<p>אין משימות פתוחות עבור המשתמש הנבחר.</p>"}
${btn("🏠 חזרה לבית","home()","gray")}</div>`)}
function assignScreen(i){let t=tickets[i],p=currentPerson();if(!t||closed(t)||p.role!=="manager"||t.managerId!==p.id)return inbox();let eligible=DEMO_PEOPLE.filter(x=>x.role==="tech"&&x.trade===t.trade);show(`<div class="card"><h2>👨‍🔧 שיבוץ משימה</h2><p>${esc(t.generator)} · ${tradeTag(t)}</p><label>בחירת איש מקצוע</label><select id="assignPerson">${eligible.map(x=>`<option value="${x.id}">${esc(x.label)}</option>`).join("")}</select>${btn("שבץ ושלח התראה",`assignTask(${i})`,"green")}${btn("חזרה","inbox()","gray")}</div>`)}
function assignTask(i){let t=tickets[i],p=currentPerson(),selected=document.getElementById("assignPerson")?.value;if(!t||closed(t)||p.role!=="manager"||t.managerId!==p.id||!DEMO_PEOPLE.some(x=>x.id===selected&&x.role==="tech"&&x.trade===t.trade))return inbox();t.assignedId=selected;t.acceptedAt=null;t.assignee=personName(selected);t.status="בתכנון";logEvent(t,p.label,"שובץ "+personName(selected)+" ונשלחה התראה פנימית","assign");save();inbox()}
function acceptTask(i){let t=tickets[i],p=currentPerson();if(!t||closed(t)||p.role!=="tech"||t.assignedId!==p.id)return inbox();t.acceptedAt=Date.now();t.status="בטיפול";logEvent(t,p.label,"אישר קבלת המשימה","accept");save();inbox()}
function report(){
show(`<div class="card">
<h2>🚨 פתיחת קריאת תקלה</h2>
<label>בחר גנרטור</label><select id="reportGen" onchange="checkDuplicate()">${GENERATORS.map(g=>`<option value="${g}">${g}</option>`).join("")}</select>
<div id="duplicateNotice"></div><label>תיאור קצר של התקלה</label>
<textarea id="description" rows="4" placeholder="תאר בקצרה את התקלה (נתוני דמה בלבד)"></textarea>
<label>גורם מקצועי נדרש</label>${tradeSelect()}<label>השפעה על כשירות</label><select id="impact"><option value="yes">🔴 תקלה משביתה — לא כשיר</option><option value="no">🟢 תקלה לא משביתה</option></select><p class="small">תקלה משביתה מעדכנת את הכשירות אוטומטית עד סגירתה. אין להזין מידע אמיתי.</p>
<div id="createNewBtn">${btn("שלח קריאת תקלה","createTicket()","green")}</div>
${btn("חזרה","home()","gray")}
</div>`);document.getElementById("reportGen").value=generator;checkDuplicate()
}
function newTicket(status,description,impactsReadiness=false){
let existing=activeTicket(generator);if(existing>=0){ticket(existing);return null}
let t={
id:"DEMO-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,6),
generator,status,description,result,
history:[...history],reporterId:currentPerson().role==="reporter"?demoUser:null,
trade:"general",date:new Date().toLocaleString("he-IL"),createdAt:Date.now(),closedAt:["סגורה","נסגרה עצמאית"].includes(status)?Date.now():null,impactsReadiness
};
logEvent(t,"משתמש דמה","נפתחה קריאה: "+description,"open");if(!closed(t))routeFault(t);tickets.unshift(t);save();return t
}
function closeSelf(){
let t=newTicket("נסגרה עצמאית","המשתמש דיווח שהתקלה נפתרה");
if(t)ticketDone(t)
}
function createTicket(){
let description=document.getElementById("description").value.trim();
generator=document.getElementById("reportGen").value;
if(activeTicket(generator)>=0){ticket(activeTicket(generator));return}
let t=newTicket("חדשה",description||"ללא תיאור נוסף",document.getElementById("impact").value==="yes");if(!t)return;t.trade=document.getElementById("trade").value;routeFault(t);save();
ticketDone(t)
}
function ticketDone(t){
show(`<div class="card">
<h2>✅ הקריאה נשמרה</h2>
<div class="badge">
מספר קריאה: ${t.id}<br>
סטטוס: ${t.status}<br>כשירות נוכחית: ${ready(t.generator)?"כשיר":"לא כשיר"}
</div>
<p>הקריאה נשמרה בדפדפן הנוכחי בלבד.</p>
${btn("📋 התקלות שלי","myTickets()")}
${btn("🏠 חזרה לבית","home()","gray")}
</div>`)
}
function myTickets(){
let mine=tickets.filter(canViewTicket),open=mine.filter(t=>!closed(t)).length,done=mine.length-open;
show(`<div class="card"><h2>${currentPerson().role==="reporter"?"📋 התקלות שלי":"📋 ניהול קריאות תקלה"}</h2><div class="ticket-sections"><div class="ticket-section open"><strong>${open}</strong>תקלות פתוחות</div><div class="ticket-section done"><strong>${done}</strong>תקלות שנסגרו</div></div>
<h3>🟠 תקלות פתוחות — לטיפול / תכנון</h3>${ticketCards("open")}
<h3>🟢 תקלות שנסגרו — היסטוריה</h3>${ticketCards("done")}
${btn("🚨 פתיחת תקלה","directReport()","red")}${currentPerson().role==="reporter"?"":btn("🗓️ לוח תכנון","planningBoard()","gold")}${btn("🏠 חזרה לבית","home()","gray")}</div>`);
document.querySelectorAll(".safe-desc").forEach(el=>el.textContent=tickets[Number(el.dataset.i)].description)
}
function ticket(i){
let t=tickets[i];if(!t||!canViewTicket(t))return myTickets();
show(`<div class="card">
<h2>קריאה ${t.id}</h2>
<p><strong>גנרטור:</strong> ${t.generator}</p>
<p><strong>סטטוס:</strong> ${esc(t.status)}</p><p><strong>גורם מקצועי:</strong> ${tradeTag(t)}</p>
${!closed(t)&&currentPerson().role!=="reporter"?`<label>עדכון הגורם המקצועי הנדרש</label>${tradeSelect(t.trade||"general")}${btn("שמור גורם מקצועי",`changeTrade(${i})`,"gray")}`:""}
<p><strong>תיאור:</strong> <span id="ticketDescription"></span></p><p><strong>השפעה על כשירות:</strong> ${t.impactsReadiness?"משביתה":"לא משביתה"}</p><p><strong>משך מאז פתיחת התקלה:</strong> ${span(t)}</p><p><strong>משך אי־כשירות מצטבר:</strong> ${unreadySpan(t)}</p><p class="small">השעון מתחיל בפתיחת הקריאה המקורית, ממשיך גם בזמן אבחון, העברה והמתנה, ונעצר רק בסגירה מלאה.</p><p><strong>נפתחה:</strong> ${t.createdAt?new Date(t.createdAt).toLocaleString("he-IL"):t.date||"לא ידוע"}</p><p><strong>נסגרה:</strong> ${t.closedAt?new Date(t.closedAt).toLocaleString("he-IL"):"טרם נסגרה"}</p>
<h3>📖 סיפור דרך מלא</h3><div id="ticketTimeline">${eventHtml(t)}</div><h3>היסטוריית אבחון ראשוני</h3>
<div id="ticketHistory"></div>
${currentPerson().role!=="reporter"&&t.status!=="סגורה"&&t.status!=="נסגרה עצמאית"?
btn("📝 הוסף המשך סיפור / העבר גורם",`updateForm(${i})`,"green")+
btn("🗓️ תכנון ושיבוץ",`planTicket(${i})`,"gold")+
btn("סמן בתכנון",`statusChange(${i},"בתכנון")`,"gold")+
btn("סמן כבטיפול",`statusChange(${i},"בטיפול")`)+
btn("סגור קריאה",`statusChange(${i},"סגורה")`,"green"):""}
${btn("חזרה לתקלות שלי","myTickets()","gray")}
</div>`);
document.getElementById("ticketDescription").textContent=t.description;
let h=document.getElementById("ticketHistory");
t.history.forEach(x=>{
let p=document.createElement("p");
p.textContent=x.q+" — "+x.a;h.appendChild(p)
})
}
function statusChange(i,s){if(currentPerson().role==="reporter")return myTickets();
let t=tickets[i];if(!t||closed(t))return;logEvent(t,"משתמש דמה","סטטוס עודכן: "+t.status+" ← "+s,s==="סגורה"?"close":"status");t.status=s;if(s==="סגורה")t.closedAt=Date.now();save();ticket(i)
}
function dashboard(){
let [a,b]=bounds(period),gs=filterGen==="all"?GENERATORS:[filterGen],open=tickets.filter(t=>!closed(t)&&gs.includes(t.generator)),finished=tickets.filter(t=>closed(t)&&t.createdAt&&t.closedAt&&t.closedAt>=a&&t.closedAt<=b&&gs.includes(t.generator)),average=finished.length?finished.reduce((sum,t)=>sum+t.closedAt-t.createdAt,0)/finished.length:null,points=chartData(period,filterGen),downtime=gs.reduce((sum,g)=>sum+outage(g,a,b),0);
show(`<div class="card"><h2>📊 כשירות וביצועים</h2><label>בחירת גנרטור</label><select id="filterGen"><option value="all">כלל הגנרטורים</option>${GENERATORS.map(g=>`<option value="${g}">${g}</option>`).join("")}</select><div class="tabs">${[["day","יום"],["week","שבוע"],["month","חודש"],["year","שנה"]].map(([k,label])=>btn(label,`setPeriod('${k}')`,period===k?"green":"gray")).join("")}</div><div class="grid"><div class="metric">כשירות נוכחית<strong>${(100*gs.filter(ready).length/gs.length).toFixed(0)}%</strong></div><div class="metric">כשירות בתקופה<strong>${pct(a,b,filterGen).toFixed(1)}%</strong></div><div class="metric">קריאות פתוחות<strong>${open.length}</strong></div><div class="metric">זמן טיפול ממוצע<strong style="font-size:17px">${average===null?"אין נתונים":dur(average)}</strong></div></div><h3>📈 גרף כשירות לפי ${({day:"שעות",week:"ימים",month:"ימים",year:"חודשים"})[period]}</h3><div class="chart">${points.map(([label,value])=>`<div class="bar" title="${label}: ${value.toFixed(1)}%" style="height:${Math.max(2,value)}%;background:${value<90?"#bb4050":value<99?"#d89c25":"#16865e"}"></div>`).join("")}</div><p class="small">מימין: ${points[0]?.[0]||""} | משמאל: ${points[points.length-1]?.[0]||""}. כל עמודה מייצגת אחוז כשירות בפרק הזמן שלה.</p><div class="badge">🛠️ טיפולים חודשיים ממתינים: ${dueMaintenance().filter(g=>gs.includes(g)).length}</div><div class="badge">⏱️ השבתה מצטברת: ${dur(downtime)}</div><div class="badge">✅ קריאות שנסגרו בתקופה: ${finished.length}</div><p class="small">כשירות מחושבת לפי זמן השבתה בפועל מתוך הזמן הנמדד, ללא ספירה כפולה של תקלות חופפות. נתוני עבר מגרסה 7 אינם כוללים חותמות זמן מדויקות.</p>${btn("🚨 פתיחת תקלה","directReport()","red")}${btn("🛠️ שגרת אחזקה","maintenanceHome()","gold")}${btn("📋 קריאות","myTickets()")}${btn("🏠 בית","home()","gray")}</div>`);
document.getElementById("filterGen").value=filterGen;document.getElementById("filterGen").onchange=e=>{filterGen=e.target.value;dashboard()}
}
function setPeriod(p){period=p;dashboard()}
function users(){
show(`<div class="card">
<h2>👥 ניהול משתמשים</h2>
<p>בגרסה הבאה נוסיף הרשמה באימייל, אישור מנהל והרשאות לפי תפקיד.</p>
<div class="badge">משתמש כללי • אחזקה • טכנאי • חשמלאי • מפקד • מנהל</div>
<p class="small">כרגע זהו מסך הדגמה בלבד, ללא אימות משתמשים.</p>
${btn("חזרה לבית","home()","gray")}
</div>`)
}
home();
</script>
</body>
</html>
