<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ניהול תקלות גנרטורים</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#edf2f7;font-family:Arial,sans-serif;color:#172b45}
header{background:#142b47;color:white;padding:24px;text-align:center}
header h1{margin:0;font-size:23px}
header p{color:#b9cce0}
main{max-width:520px;margin:auto;padding:18px}
.card{background:white;border-radius:20px;padding:22px;margin:14px 0;box-shadow:0 4px 18px #152c4512}
h2{margin-top:0}
button{width:100%;border:0;border-radius:14px;padding:17px;margin:7px 0;font-size:17px;font-weight:bold;background:#195caa;color:white;cursor:pointer}
button:active{opacity:.7}
.green{background:#16865e}
.red{background:#bb4050}
.gray{background:#e8eef5;color:#20334c}
.gold{background:#d89c25;color:#172b45}
input,textarea{width:100%;padding:14px;border:1px solid #ccd5df;border-radius:12px;font-size:16px;margin:8px 0}
.small{color:#64748b;font-size:14px}
.badge{background:#e7f2ff;border-radius:12px;padding:12px;margin:10px 0}
.progress{height:7px;background:#dce5ef;border-radius:9px;margin:18px 0}
.progress div{height:100%;background:#16865e;border-radius:9px}
.row{display:flex;gap:10px}
.row button{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:#edf5fc;border-radius:12px;padding:14px;text-align:center}.metric strong{display:block;font-size:25px}.tabs{display:flex;gap:5px}.tabs button{padding:10px;font-size:14px}.chart{height:175px;display:flex;align-items:end;gap:3px;border-bottom:1px solid #bbb}.bar{flex:1;min-width:2px;background:#16865e;border-radius:4px 4px 0 0}select{width:100%;padding:14px;font-size:16px;border-radius:12px;border:1px solid #ccd5df;background:white;margin:8px 0}.note{background:#fff3d6;padding:12px;border-radius:12px}</style>
</head>
<body>
<header>
<h1>⚡ מרכז ניהול גנרטורים</h1>
<p>אבחון תקלות • ניהול קריאות • מעקב</p>
</header>
<main id="app"></main>
<script>
const $=document.getElementById("app");
const KEY="generator_demo_v8";
const GENERATORS=["GEN-DEMO-001","GEN-DEMO-002","GEN-DEMO-003","GEN-DEMO-004","GEN-DEMO-005"];
let period="day",filterGen="all";
let tickets=[];
try{tickets=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
let step="",history=[],generator="GEN-DEMO-001",result="";
if(!localStorage.getItem(KEY)){try{tickets=(JSON.parse(localStorage.getItem("generator_demo_v7"))||[]).map(t=>({...t,impactsReadiness:false,createdAt:null,closedAt:null}));save()}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tickets))}catch(e){}}
function show(html){$.innerHTML=html}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&#39;","'":"&#39;"}[c]))}
function closed(t){return ["סגורה","נסגרה עצמאית"].includes(t.status)}
function ready(g){return !tickets.some(t=>t.generator===g&&t.impactsReadiness&&!closed(t))}
function dur(ms){let m=Math.max(0,Math.floor(ms/60000));return (Math.floor(m/1440)?Math.floor(m/1440)+" ימים ":"")+(Math.floor(m%1440/60)?Math.floor(m%1440/60)+" שעות ":"")+(m%60)+" דקות"}
function span(t){return t.createdAt?dur((t.closedAt||Date.now())-t.createdAt):"לא זמין (קריאה ישנה)"}
function outage(g,a,b){let intervals=tickets.filter(t=>t.generator===g&&t.impactsReadiness&&t.createdAt).map(t=>[Math.max(a,t.createdAt),Math.min(b,t.closedAt||Date.now())]).filter(x=>x[1]>x[0]).sort((x,y)=>x[0]-y[0]);let total=0,last=null;for(const [x,y] of intervals){if(!last)last=[x,y];else if(x<=last[1])last[1]=Math.max(last[1],y);else{total+=last[1]-last[0];last=[x,y]}}if(last)total+=last[1]-last[0];return total}
function pct(a,b,g){if(b<=a)return 100;let gs=g==="all"?GENERATORS:[g];return Math.max(0,100*(1-gs.reduce((n,x)=>n+outage(x,a,b),0)/((b-a)*gs.length)))}
function bounds(p){let d=new Date(),b=Date.now();d.setHours(0,0,0,0);if(p==="week")d.setDate(d.getDate()-6);if(p==="month")d.setDate(d.getDate()-29);if(p==="year"){d.setDate(1);d.setMonth(d.getMonth()-11)}return [d.getTime(),b]}
function chartData(p,g){let now=new Date(),data=[];if(p==="day"){let start=new Date();start.setHours(0,0,0,0);for(let i=0;i<=now.getHours();i++){let a=start.getTime()+i*3600000;data.push([String(i),pct(a,Math.min(a+3600000,Date.now()),g)])}}else if(p==="week"||p==="month"){let n=p==="week"?7:30;for(let i=n-1;i>=0;i--){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);let a=d.getTime();data.push([d.getDate()+"/"+(d.getMonth()+1),pct(a,Math.min(a+86400000,Date.now()),g)])}}else{for(let i=11;i>=0;i--){let d=new Date(now.getFullYear(),now.getMonth()-i,1),a=d.getTime(),b=Math.min(Date.now(),new Date(d.getFullYear(),d.getMonth()+1,1).getTime());data.push([(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(-2),pct(a,b,g)])}}return data}

function btn(label,action,cls=""){
return `<button class="${cls}" onclick="${esc(action)}">${label}</button>`
}
function home(){
show(`<div class="card">
<h2>שלום וברוכים הבאים 👋</h2>
<p>מה תרצה לעשות?</p>
${btn("🔍 התחלת אבחון תקלה","identify()","green")}
${btn("🚨 פתיחת תקלה ישירה","directReport()","red")}
${btn("📋 התקלות שלי","myTickets()")}
${btn("📊 תמונת מצב","dashboard()")}
${btn("👥 ניהול משתמשים","users()","gray")}
</div>
<div class="card">
<h3>מערכת הדגמה</h3>
<p class="small">המערכת פועלת עם נתוני דמה בלבד ובדפדפן הנוכחי. אין להזין מידע אמיתי או רגיש.</p>
</div>`)
}
function identify(){
show(`<div class="card">
<h2>📷 זיהוי גנרטור</h2>
<p>סרוק קוד QR לזיהוי הגנרטור.</p>
<div class="badge">סריקה אמיתית תתווסף בהמשך.</div>
${btn("🔳 הדמיית סריקת QR","confirmGenerator()","green")}
${btn("חזרה","home()","gray")}
</div>`)
}
function confirmGenerator(){
show(`<div class="card">
<h2>✅ גנרטור זוהה</h2>
<div class="badge">
<strong>${generator}</strong><br>
דגם: גנרטור הדגמה A<br>
סוג: דיזל<br>
סטטוס אחרון: תקין
</div>
<h3>האם זה הגנרטור הנכון?</h3>
${btn("כן, התחל אבחון","start()","green")}
${btn("לא, סרוק שוב","identify()","red")}
</div>`)
}
function start(){history=[];question("running")}
const tree={
running:{q:"האם הגנרטור עובד כרגע?",a:[
["כן","power"],["לא","fuel"]]},
power:{q:"האם יש אספקת חשמל באתר?",a:[
["כן","resolved"],["לא","construction"]]},
fuel:{q:"האם יש מספיק דלק בגנרטור?",a:[
["כן","battery"],["לא","fuelHelp"]]},
fuelHelp:{q:"לאחר בדיקה וטיפול בידי גורם מוסמך, האם הגנרטור חזר לפעול?",a:[
["כן","resolved"],["לא","battery"]]},
battery:{q:"מה קורה בניסיון ההתנעה?",a:[
["אין תגובה או נשמע תקתוק חלש","batteryHelp"],
["הסטרטר מסתובב אך המנוע לא מניע","oil"]]},
batteryHelp:{q:"האם גורם מוסמך בדק את מערכת ההתנעה והתקלה נפתרה?",a:[
["כן","resolved"],["לא","oil"]]},
oil:{q:"האם מפלס השמן תקין לפי בדיקה מאושרת?",a:[
["כן","breaker"],["לא","oilHelp"]]},
oilHelp:{q:"האם התקלה נפתרה לאחר טיפול של גורם מוסמך?",a:[
["כן","resolved"],["לא","breaker"]]},
breaker:{q:"האם המפסק הראשי במצב ON?",a:[
["כן","unresolved"],["לא / קפץ","electric"]]}
};
function question(id){
step=id;
if(!tree[id]){finish(id);return}
let node=tree[id];
show(`<div class="card">
<div class="small">אבחון גנרטור ${generator}</div>
<div class="progress"><div style="width:${Math.min(100,15+history.length*14)}%"></div></div>
<h2>🔧 ${node.q}</h2>
${node.a.map(([label,next])=>`<button onclick='answer(${JSON.stringify(label)},${JSON.stringify(next)})'>${label}</button>`).join("")}
${btn("⬅ חזרה לשאלה קודמת","back()","gray")}
${btn("🏠 ביטול וחזרה לבית","home()","gray")}
</div>`)
}
function answer(label,next){
history.push({id:step,q:tree[step].q,a:label});
question(next)
}
function back(){
let last=history.pop();
if(last)question(last.id);else confirmGenerator()
}
function finish(type){
result=type;
let messages={
resolved:"התקלה נפתרה או שאין תקלה פעילה",
construction:"הגנרטור פועל אך אין חשמל באתר. יש להפנות לבדיקת תשתית החשמל.",
electric:"נדרש טיפול של חשמלאי מוסמך.",
unresolved:"נדרש המשך אבחון על ידי גורם אחזקה מקצועי."
};
show(`<div class="card">
<h2>📋 סיכום אבחון</h2>
<div class="badge">${messages[type]}</div>
<p>גנרטור: ${generator}</p>
<p>מספר תשובות שנרשמו: ${history.length}</p>
${btn("✅ התקלה נפתרה — שמור וסגור","closeSelf()","green")}
${btn("🚨 התקלה לא נפתרה — פתח קריאה","report()","red")}
${btn("חזרה לאבחון","back()","gray")}
</div>`)
}
function directReport(){history=[];result="unresolved";report()}
function report(){
show(`<div class="card">
<h2>🚨 פתיחת קריאת תקלה</h2>
<label>בחר גנרטור</label><select id="reportGen">${GENERATORS.map(g=>`<option value="${g}">${g}</option>`).join("")}</select>
<label>תיאור קצר של התקלה</label>
<textarea id="description" rows="4" placeholder="תאר בקצרה את התקלה (נתוני דמה בלבד)"></textarea>
<label>השפעה על כשירות</label><select id="impact"><option value="yes">🔴 תקלה משביתה — לא כשיר</option><option value="no">🟢 תקלה לא משביתה</option></select><p class="small">תקלה משביתה מעדכנת את הכשירות אוטומטית עד סגירתה. אין להזין מידע אמיתי.</p>
${btn("שלח קריאת תקלה","createTicket()","green")}
${btn("חזרה","home()","gray")}
</div>`)
}
function newTicket(status,description,impactsReadiness=false){
let t={
id:"DEMO-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,6),
generator,status,description,result,
history:[...history],
date:new Date().toLocaleString("he-IL"),createdAt:Date.now(),closedAt:["סגורה","נסגרה עצמאית"].includes(status)?Date.now():null,impactsReadiness
};
tickets.unshift(t);save();return t
}
function closeSelf(){
let t=newTicket("נסגרה עצמאית","המשתמש דיווח שהתקלה נפתרה");
ticketDone(t)
}
function createTicket(){
let description=document.getElementById("description").value.trim();
generator=document.getElementById("reportGen").value;
let t=newTicket("חדשה",description||"ללא תיאור נוסף",document.getElementById("impact").value==="yes");
ticketDone(t)
}
function ticketDone(t){
show(`<div class="card">
<h2>✅ הקריאה נשמרה</h2>
<div class="badge">
מספר קריאה: ${t.id}<br>
סטטוס: ${t.status}<br>כשירות נוכחית: ${ready(t.generator)?"כשיר":"לא כשיר"}
</div>
<p>הקריאה נשמרה בדפדפן הנוכחי בלבד.</p>
${btn("📋 התקלות שלי","myTickets()")}
${btn("🏠 חזרה לבית","home()","gray")}
</div>`)
}
function myTickets(){
show(`<div class="card"><h2>📋 התקלות שלי</h2>
${tickets.length?tickets.map((t,i)=>`
<div class="badge">
<strong>${t.id}</strong><br>
${t.generator}<br>
<span class="safe-desc" data-i="${i}"></span><br>
סטטוס: ${t.status}<br>השפעה: ${t.impactsReadiness?"🔴 משביתה":"🟢 לא משביתה"}<br>משך טיפול: ${span(t)}<br>
${t.date}
${btn("צפייה בפרטי הקריאה",`ticket(${i})`,"gray")}
</div>`).join(""):"<p>עדיין אין קריאות.</p>"}
${btn("🏠 חזרה לבית","home()","gray")}
</div>`);document.querySelectorAll(".safe-desc").forEach(el=>el.textContent=tickets[Number(el.dataset.i)].description)
}
function ticket(i){
let t=tickets[i];if(!t)return myTickets();
show(`<div class="card">
<h2>קריאה ${t.id}</h2>
<p><strong>גנרטור:</strong> ${t.generator}</p>
<p><strong>סטטוס:</strong> ${t.status}</p>
<p><strong>תיאור:</strong> <span id="ticketDescription"></span></p><p><strong>השפעה על כשירות:</strong> ${t.impactsReadiness?"משביתה":"לא משביתה"}</p><p><strong>משך טיפול:</strong> ${span(t)}</p><p><strong>נפתחה:</strong> ${t.createdAt?new Date(t.createdAt).toLocaleString("he-IL"):t.date||"לא ידוע"}</p><p><strong>נסגרה:</strong> ${t.closedAt?new Date(t.closedAt).toLocaleString("he-IL"):"טרם נסגרה"}</p>
<h3>היסטוריית אבחון</h3>
<div id="ticketHistory"></div>
${t.status!=="סגורה"&&t.status!=="נסגרה עצמאית"?
btn("סמן כבטיפול",`statusChange(${i},"בטיפול")`)+
btn("סגור קריאה",`statusChange(${i},"סגורה")`,"green"):""}
${btn("חזרה לתקלות שלי","myTickets()","gray")}
</div>`);
document.getElementById("ticketDescription").textContent=t.description;
let h=document.getElementById("ticketHistory");
t.history.forEach(x=>{
let p=document.createElement("p");
p.textContent=x.q+" — "+x.a;h.appendChild(p)
})
}
function statusChange(i,s){
tickets[i].status=s;if(s==="סגורה")tickets[i].closedAt=Date.now();save();ticket(i)
}
function dashboard(){
let [a,b]=bounds(period),gs=filterGen==="all"?GENERATORS:[filterGen],open=tickets.filter(t=>!closed(t)&&gs.includes(t.generator)),finished=tickets.filter(t=>closed(t)&&t.createdAt&&t.closedAt&&t.closedAt>=a&&t.closedAt<=b&&gs.includes(t.generator)),average=finished.length?finished.reduce((sum,t)=>sum+t.closedAt-t.createdAt,0)/finished.length:null,points=chartData(period,filterGen),downtime=gs.reduce((sum,g)=>sum+outage(g,a,b),0);
show(`<div class="card"><h2>📊 כשירות וביצועים</h2><label>בחירת גנרטור</label><select id="filterGen"><option value="all">כלל הגנרטורים</option>${GENERATORS.map(g=>`<option value="${g}">${g}</option>`).join("")}</select><div class="tabs">${[["day","יום"],["week","שבוע"],["month","חודש"],["year","שנה"]].map(([k,label])=>btn(label,`setPeriod('${k}')`,period===k?"green":"gray")).join("")}</div><div class="grid"><div class="metric">כשירות נוכחית<strong>${(100*gs.filter(ready).length/gs.length).toFixed(0)}%</strong></div><div class="metric">כשירות בתקופה<strong>${pct(a,b,filterGen).toFixed(1)}%</strong></div><div class="metric">קריאות פתוחות<strong>${open.length}</strong></div><div class="metric">זמן טיפול ממוצע<strong style="font-size:17px">${average===null?"אין נתונים":dur(average)}</strong></div></div><h3>📈 גרף כשירות לפי ${({day:"שעות",week:"ימים",month:"ימים",year:"חודשים"})[period]}</h3><div class="chart">${points.map(([label,value])=>`<div class="bar" title="${label}: ${value.toFixed(1)}%" style="height:${Math.max(2,value)}%;background:${value<90?"#bb4050":value<99?"#d89c25":"#16865e"}"></div>`).join("")}</div><p class="small">מימין: ${points[0]?.[0]||""} | משמאל: ${points[points.length-1]?.[0]||""}. כל עמודה מייצגת אחוז כשירות בפרק הזמן שלה.</p><div class="badge">⏱️ השבתה מצטברת: ${dur(downtime)}</div><div class="badge">✅ קריאות שנסגרו בתקופה: ${finished.length}</div><p class="small">כשירות מחושבת לפי זמן השבתה בפועל מתוך הזמן הנמדד, ללא ספירה כפולה של תקלות חופפות. נתוני עבר מגרסה 7 אינם כוללים חותמות זמן מדויקות.</p>${btn("🚨 פתיחת תקלה","directReport()","red")}${btn("📋 קריאות","myTickets()")}${btn("🏠 בית","home()","gray")}</div>`);
document.getElementById("filterGen").value=filterGen;document.getElementById("filterGen").onchange=e=>{filterGen=e.target.value;dashboard()}
}
function setPeriod(p){period=p;dashboard()}
function users(){
show(`<div class="card">
<h2>👥 ניהול משתמשים</h2>
<p>בגרסה הבאה נוסיף הרשמה באימייל, אישור מנהל והרשאות לפי תפקיד.</p>
<div class="badge">משתמש כללי • אחזקה • טכנאי • חשמלאי • מפקד • מנהל</div>
<p class="small">כרגע זהו מסך הדגמה בלבד, ללא אימות משתמשים.</p>
${btn("חזרה לבית","home()","gray")}
</div>`)
}
home();
</script>
</body>
</html>
