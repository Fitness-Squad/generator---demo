<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מערכת תקלות גנרטורים | אבטיפוס 5</title><style>
:root{--ink:#142b47;--blue:#195caa;--gold:#f5bc3d;--bg:#eef3f9;--line:#dce5ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,'Arial',sans-serif;color:var(--ink)}header{background:#102a4b;color:white;padding:18px 18px 15px}header strong{font-size:22px}header p{margin:6px 0 0;font-size:13px;color:#d7e6fa}.wrap{max-width:720px;margin:auto;padding:16px 15px 90px}.card{background:white;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 4px 18px #17365710}h2{margin:0 0 12px;font-size:23px}h3{margin:8px 0}p{line-height:1.6}.muted{color:#61758b;font-size:14px}.pill{display:inline-block;border-radius:20px;background:#eaf2ff;color:#195caa;padding:6px 10px;font-size:12px;margin:3px}.warning{background:#fff4d7;border-right:4px solid var(--gold);padding:12px;border-radius:8px;font-size:14px}.btn,button{border:0;background:var(--blue);color:white;border-radius:12px;padding:13px 15px;font:600 16px system-ui;cursor:pointer;min-height:46px}.btn{display:block;text-align:center;text-decoration:none;margin:8px 0}.secondary{background:#e9f0f8;color:var(--ink)}.green{background:#167b55}.orange{background:#a95c0a}.danger{background:#b33d43}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}.stack>*{width:100%;margin:6px 0}input,select,textarea{width:100%;padding:12px;border:1px solid #b9cada;border-radius:10px;font:16px system-ui;margin:6px 0 12px;background:white}textarea{min-height:85px}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.small{font-size:13px}.visual{height:150px;border-radius:16px;background:linear-gradient(145deg,#e4ebf4,#b9cde2);display:grid;place-items:center;margin:14px 0}.visual svg{max-height:140px;width:90%}nav{position:fixed;bottom:0;background:#102a4b;width:100%;display:flex;justify-content:center;padding:8px;gap:5px}nav button{font-size:12px;min-height:42px;padding:8px;max-width:170px;background:#274d76}.metric{background:#eaf2fb;padding:13px;border-radius:12px;flex:1;text-align:center}.metric b{font-size:26px;display:block} .steps{font-size:14px;color:#506986;margin:10px 0}label{font-size:14px;font-weight:600}button:focus-visible{outline:3px solid #f5bc3d} @media(min-width:650px){header{text-align:center}}
</style></head><body><header><strong>⚡ ניהול ואבחון תקלות גנרטורים</strong><p>אבטיפוס אינטראקטיבי • נתוני דמה בלבד • ללא שרת וללא שיתוף מידע</p></header><div class="wrap" id="app"></div><nav><button onclick="home()">בית</button><button onclick="tickets()">קריאות</button><button onclick="dashboard()">ניהול</button><button onclick="account()">משתמש</button></nav><script>
const KEY='gen_demo_v5';const initial={role:'משתמש כללי',approved:true,users:[{name:'משתמש הדגמה',email:'demo@example.invalid',role:'משתמש כללי',approved:true},{name:'משתמש ממתין',email:'pending@example.invalid',role:'טכנאי',approved:false}],tickets:[],notifications:[]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){db=structuredClone(initial)};let selected=null,answers=[],node='start';const machines=[{id:'DEMO-101',model:'דגם הדרכה א׳',type:'גנרטור דיזל'},{id:'DEMO-202',model:'דגם הדרכה ב׳',type:'גנרטור נייד'}];const tree={start:{q:'האם הגנרטור פועל?',yes:'power',no:'safe'},safe:{q:'האם קיימת התראה או חיווי תקלה בלוח הבקרה?',yes:'referTech',no:'fuel'},fuel:{q:'האם מפלס הדלק מוצג כתקין?',yes:'referTech',no:'referMaint'},power:{q:'האם קיים חיווי אספקת חשמל תקינה?',yes:'solved',no:'referElec'}};const outcomes={referTech:['נדרש טכנאי','טכנאי'],referMaint:['נדרש איש אחזקה','אחזקה'],referElec:['נדרש חשמלאי','חשמלאי'],solved:['בדיקת תקינות הושלמה','ללא']};function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}function render(s){document.getElementById('app').innerHTML=s}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function notice(s){return `<div class="warning">${s}</div>`}function gate(){return !db.approved?notice('החשבון ממתין לאישור מנהל. במערכת אמיתית האישור ייאכף בשרת.'):''}function home(){render(`<div class="card"><h2>שלום, ${esc(db.role)}</h2><p>מערכת הדרכה המדגימה זיהוי גנרטור, אבחון, פתיחת קריאה, ניתוב ומעקב.</p>${notice('אין להזין נתוני אמת, שמות, מספרי טלפון, מיקומים או תמונות. לפני שימוש מבצעי נדרש אישור אבטחת מידע והגורמים המוסמכים.')}</div><div class="card stack"><h2>מה תרצה לעשות?</h2><button onclick="identify()">זיהוי גנרטור והתחלת אבחון</button><button class="secondary" onclick="tickets()">הקריאות שלי ומעקב סטטוס</button><button class="secondary" onclick="dashboard()">מסך ניהול ותמונת מצב</button></div><div class="card"><h3>תהליך העבודה</h3><p class="steps">בחירת תמונה ממאגר הדגמה ← אימות משתמש ← עץ אבחון ← סגירה או פתיחת קריאה ← ניתוב והתראות מדומות</p></div>`)}function identify(){render(`<div class="card"><h2>1. זיהוי גנרטור</h2><p>בחר גנרטור מתוך מאגר ההדגמה. התמונה היא איור מקומי בלבד, לא צילום של ציוד אמיתי.</p><div class="visual"><svg viewBox="0 0 300 140" aria-label="איור גנרטור"><rect x="40" y="30" width="220" height="85" rx="12" fill="#315a7f"/><rect x="58" y="44" width="105" height="55" rx="7" fill="#789ab4"/><path d="M70 58h80M70 70h80M70 82h80" stroke="#315a7f" stroke-width="5"/><rect x="180" y="45" width="58" height="50" rx="5" fill="#e5eff8"/><circle cx="196" cy="62" r="9" fill="#f5bc3d"/><rect x="205" y="78" width="22" height="7" fill="#315a7f"/><circle cx="83" cy="117" r="12" fill="#152d46"/><circle cx="216" cy="117" r="12" fill="#152d46"/></svg></div><label>בחר מזהה דמה</label><select id="machine">${machines.map(m=>`<option value="${m.id}">${m.id} — ${m.model}</option>`).join('')}</select><button onclick="confirmMachine()">המשך לאימות</button><p class="muted">סריקת QR אמיתית וחיבור למאגר ארגוני אינם פעילים בגרסת הקובץ המקומית.</p></div>`)}function confirmMachine(){selected=machines.find(m=>m.id===document.getElementById('machine').value);render(`<div class="card"><h2>2. אימות משתמש</h2><span class="pill">${selected.id}</span><p>דגם: ${selected.model}</p><p>האם זה הגנרטור שהתכוונת לדווח עליו?</p><div class="row"><button class="green" onclick="startDiagnosis()">כן, התחל אבחון</button><button class="secondary" onclick="identify()">לא, חזור לבחירה</button></div><p class="muted">במערכת אמיתית יש לאמת הרשאות מול שרת מאובטח, לא רק להסתמך על אישור במסך.</p></div>`)}function startDiagnosis(){answers=[];node='start';diagnose()}function diagnose(){if(outcomes[node])return result();const n=tree[node];render(`<div class="card"><h2>3. אבחון מודרך</h2><p class="steps">${esc(selected.id)} • שאלה ${answers.length+1}</p><h3>${n.q}</h3>${notice('שאלות תצפית בלבד. אין לבצע עבודות חשמל, לפתוח מכלולים או לעקוף מנגנוני בטיחות לפי הנחיות האפליקציה.') }<div class="row"><button class="green" onclick="answer(true)">כן</button><button class="orange" onclick="answer(false)">לא</button></div><button class="secondary" onclick="identify()">ביטול אבחון</button></div>`)}function answer(v){const n=tree[node];answers.push({question:n.q,answer:v?'כן':'לא'});node=v?n.yes:n.no;diagnose()}function result(){const o=outcomes[node];render(`<div class="card"><h2>4. תוצאת אבחון</h2><span class="pill">${o[0]}</span><p>המערכת מציעה ניתוב אל: <b>${o[1]}</b></p><div class="item">${answers.map(a=>`<div class="small">${esc(a.question)} — <b>${a.answer}</b></div>`).join('')}</div>${notice('המלצה ראשונית בלבד, לא הוראת תחזוקה ולא תחליף לאיש מקצוע מוסמך.')}<label>תיאור התקלה (נתוני דמה בלבד)</label><textarea id="desc" placeholder="לדוגמה: חיווי תקלה בהדגמה"></textarea><div class="row"><button onclick="createTicket(false)">פתח קריאה</button><button class="green" onclick="createTicket(true)">סמן כנפתר</button></div></div>`)}function createTicket(closed){let t={id:'T-'+String(Date.now()).slice(-7),machine:selected.id,category:outcomes[node][1],status:closed?'נסגרה':'פתוחה',description:document.getElementById('desc').value||'קריאת הדגמה',answers:[...answers],created:new Date().toLocaleString('he-IL'),history:[{status:closed?'נסגרה':'פתוחה',at:new Date().toLocaleString('he-IL')} ]};db.tickets.unshift(t);notify(t,closed?'סגירה':'פתיחה');save();ticket(t.id)}function notify(t,action){db.notifications.unshift({text:`התראת ${action} מדומה: ${t.id} • ${t.category} • לגורם מקצועי ולמפקד הרלוונטי`,at:new Date().toLocaleString('he-IL')})}function tickets(){render(`<div class="card"><h2>קריאות ומעקב</h2><p class="muted">הקריאות נשמרות במכשיר זה בלבד, ולא מסונכרנות.</p>${db.tickets.length?db.tickets.map(t=>`<div class="item"><b>${esc(t.id)}</b> · ${esc(t.machine)}<p>${esc(t.description)}</p><span class="pill">${esc(t.status)}</span><button class="secondary" onclick="ticket('${t.id}')">פתח פרטים</button></div>`).join(''):'<p>אין עדיין קריאות. אפשר להתחיל אבחון הדגמה.</p>'}<button onclick="identify()">אבחון חדש</button></div>`)}function ticket(id){let t=db.tickets.find(x=>x.id===id);if(!t)return tickets();render(`<div class="card"><h2>קריאה ${esc(t.id)}</h2><p>${esc(t.machine)} · ${esc(t.category)}</p><span class="pill">${esc(t.status)}</span><p>${esc(t.description)}</p><h3>מסלול האבחון</h3>${t.answers.map(a=>`<div class="item small">${esc(a.question)} — ${a.answer}</div>`).join('')}<h3>היסטוריית סטטוסים</h3>${t.history.map(h=>`<div class="item small">${esc(h.status)} · ${esc(h.at)}</div>`).join('')}<label>עדכון סטטוס</label><select id="status"><option>פתוחה</option><option>בטיפול</option><option>ממתינה לגורם מקצועי</option><option>נסגרה</option></select><button onclick="updateTicket('${t.id}')">שמור עדכון</button><button class="secondary" onclick="copyTicket('${t.id}')">העתק סיכום דמה</button><button class="secondary" onclick="tickets()">חזרה</button></div>`)}function updateTicket(id){let t=db.tickets.find(x=>x.id===id),v=document.getElementById('status').value;t.status=v;t.history.push({status:v,at:new Date().toLocaleString('he-IL')});if(v==='נסגרה')notify(t,'סגירה');save();ticket(id)}function copyTicket(id){let t=db.tickets.find(x=>x.id===id);let s=`קריאת הדגמה ${t.id}\nגנרטור ${t.machine}\nסטטוס ${t.status}\n${t.description}`;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s).then(()=>alert('הסיכום הועתק')).catch(()=>prompt('העתק את הסיכום',s));else prompt('העתק את הסיכום',s)}function dashboard(){const open=db.tickets.filter(t=>t.status!=='נסגרה').length;render(`<div class="card"><h2>מסך ניהול</h2><div class="row"><div class="metric"><b>${db.tickets.length}</b>קריאות</div><div class="metric"><b>${open}</b>פתוחות</div><div class="metric"><b>${db.tickets.length-open}</b>סגורות</div></div><h3>התראות (הדמיה בלבד)</h3>${db.notifications.length?db.notifications.slice(0,8).map(n=>`<div class="item small">${esc(n.text)}<p class="muted">${esc(n.at)}</p></div>`).join(''):'<p class="muted">אין התראות.</p>'}<h3>למידה רוחבית</h3><p class="muted">בהמשך: זיהוי תקלות חוזרות, זמני טיפול, שיעור פתרון עצמי ועלות נחסכת. אין מספיק נתונים להסקת מסקנות כעת.</p></div><div class="card"><h3>ניהול הרשאות — הדגמה</h3>${db.users.map((u,i)=>`<div class="item"><b>${esc(u.name)}</b> · ${esc(u.role)}<p class="small">${u.approved?'מאושר':'ממתין לאישור'}</p>${!u.approved?`<button onclick="approve(${i})">אשר משתמש דמה</button>`:''}</div>`).join('')}<p class="muted">אין אכיפת הרשאות אמיתית בקובץ מקומי.</p></div>`)}function approve(i){db.users[i].approved=true;save();dashboard()}function account(){render(`<div class="card"><h2>משתמש והרשאות</h2><label>תפקיד לצורך הדמיה</label><select id="role">${['משתמש כללי','אחזקה','טכנאי','חשמלאי','מפקד','מנהל מערכת'].map(r=>`<option ${db.role===r?'selected':''}>${r}</option>`).join('')}</select><button onclick="setRole()">החלף תפקיד הדגמה</button><h3>בקשת הרשמה — הדמיה</h3><p class="muted">במערכת העתידית משתמש יירשם באימייל ארגוני, יאומת וימתין לאישור מנהל. כאן אין איסוף כתובות ואין שליחת מיילים.</p><button class="secondary" onclick="resetDemo()">איפוס נתוני הדגמה</button></div>`)}function setRole(){db.role=document.getElementById('role').value;save();home()}function resetDemo(){if(confirm('למחוק את נתוני ההדגמה מהמכשיר?')){db=structuredClone(initial);save();home()}}home();
</script></body></html>
